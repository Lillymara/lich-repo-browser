# Tests, then builds the desktop apps on GitHub's Windows, macOS and Linux
# machines (Flutter can't cross-compile). Every run uploads the builds as
# workflow artifacts; pushing a tag like v1.0.0 also publishes a Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Core tests
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: App tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          tar -C app/build/linux/x64/release/bundle -czf \
            dist/lich-repo-browser-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lich-repo-browser-linux-x64
          path: dist/lich-repo-browser-linux-x64.tar.gz

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          # Ship the Visual C++ runtime so users don't need to install it.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $out
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath dist/lich-repo-browser-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lich-repo-browser-windows-x64
          path: dist/lich-repo-browser-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build macos --release
      - name: Package
        run: |
          mkdir -p dist
          # ditto keeps the .app bundle's symlinks and metadata intact.
          ditto -c -k --sequesterRsrc --keepParent \
            "app/build/macos/Build/Products/Release/Lich Repo Browser.app" \
            dist/lich-repo-browser-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lich-repo-browser-macos
          path: dist/lich-repo-browser-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lich Repo Browser $GITHUB_REF_NAME" \
            --notes "Unsigned builds. Windows: SmartScreen may warn (More info → Run anyway). macOS: right-click the app → Open the first time."
