<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324A"/>
      <stop offset="1" stop-color="#07121E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CFFB0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2BD98A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2BD98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="0.5" stop-color="#9AA7B4"/>
      <stop offset="1" stop-color="#5E6B78"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8FFD9"/>
      <stop offset="1" stop-color="#1FB673"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE39A"/>
      <stop offset="1" stop-color="#0A6B42"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="400" fill="url(#glow)"/>
