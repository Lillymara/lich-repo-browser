<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3B55"/>
      <stop offset="1" stop-color="#0E1320"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A7A"/>
      <stop offset="1" stop-color="#1C1436"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EEDC"/>
      <stop offset="1" stop-color="#BDB39A"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8FFFF"/>
      <stop offset="0.35" stop-color="#4FF3FF"/>
      <stop offset="1" stop-color="#4FF3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BF5B0"/>
      <stop offset="1" stop-color="#1FAF6E"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- hood -->
  <path d="M512 120 C340 150 250 330 240 520 C232 650 200 740 160 800 L864 800 C824 740 792 650 784 520 C774 330 684 150 512 120 Z" fill="url(#hood)"/>
  <!-- face shadow -->
