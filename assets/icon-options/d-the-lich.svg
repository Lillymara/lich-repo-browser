  <!-- skull -->
  <path d="M512 300 C410 300 356 370 356 450 C356 520 392 560 420 574 L420 630 L604 630 L604 574 C632 560 668 520 668 450 C668 370 614 300 512 300 Z" fill="url(#bone)"/>
  <g fill="#0B0816">
    <ellipse cx="450" cy="460" rx="48" ry="44"/>
    <ellipse cx="574" cy="460" rx="48" ry="44"/>
    <path d="M512 510 L490 552 L534 552 Z"/>
    <rect x="452" y="592" width="16" height="36"/>
    <rect x="490" y="592" width="16" height="36"/>
    <rect x="528" y="592" width="16" height="36"/>
    <rect x="566" y="592" width="16" height="36"/>
  </g>
  <circle cx="450" cy="460" r="46" fill="url(#eye)"/>
  <circle cx="574" cy="460" r="46" fill="url(#eye)"/>
  <!-- download arrow -->
  <path d="M452 700 L572 700 L572 800 L642 800 L512 930 L382 800 L452 800 Z" fill="url(#arrow)" stroke="#0E1320" stroke-width="18" stroke-linejoin="round"/>
